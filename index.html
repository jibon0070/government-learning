<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Formatting</title>
  </head>
  <body>
    <p>This is very <b>important</b> message.</p>
    <p>The chemical formula for water is H<sub>2</sub>O.</p>
    <p><del>Deleted text</del> and <ins>inserted text</ins> are shown here.</p>
    <p><small>Smaller text</small> can be used for disclaimers.</p>
    <p>E = mc<sup>2</sup></p>
    <h2>HTML Video with poster</h2>
    <video
      controls
      width="600"
      height="auto"
      poster="thumbnails/video-thumbnail.png"
    >
      <source
        src="https://www.w3schools.com/html/mov_bbb.mp4"
        type="video/mp4"
      />
    </video>
  </body>
</html>
