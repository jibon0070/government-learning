<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Form Element</title>
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <main>
      <h2>Homework #3</h2>
      <h3>EVENTS PAGE</h3>
      <p>Click <a href="#">here</a> to go to the welcome page</p>
      <form class="homework-3">
        <div class="form-field">
          <label for="name">Event Name</label>
          <input
            type="text"
            placeholder="eg. This event is ment for internal use"
          />
        </div>
        <div class="form-field">
          <label for="sport">Sports</label>
          <select id="sport">
            <option value="">Baseball</option>
          </select>
        </div>
        <div class="form-field">
          <label for="location">Location</label>
          <select id="location">
            <option value="">1st Street</option>
          </select>
        </div>
        <div class="form-field">
          <label for="time">Time</label>
          <input type="datetime-local" />
        </div>
        <div class="form-field">
          <label for="number-of-players">Number of players</label>
          <input type="number" id="number-of-players" placeholder="eg. 5" />
        </div>
        <div class="form-field">
          <label for="minimumage">Minimum age</label>
          <input type="number" id="minimumage" placeholder="eg. 18" />
        </div>
        <div class="form-field">
          <label for="maximum">Maximum age</label>
          <input type="number" id="maximum" placeholder="eg. 65" />
        </div>
        <div class="form-field">
          <label>Minimum Skill Level</label>
          <div style="display: flex; gap: 0.5em">
            <label class="radio">
              <input type="radio" name="min-s-l" checked />
              <span class="mark"></span>
              1
            </label>
            <label class="radio">
              <input type="radio" name="min-s-l" />
              <span class="mark"></span>
              2
            </label>
            <label class="radio">
              <input type="radio" name="min-s-l" />
              <span class="mark"></span>
              3
            </label>
            <label class="radio">
              <input type="radio" name="min-s-l" />
              <span class="mark"></span>
              4
            </label>
            <label class="radio">
              <input type="radio" name="min-s-l" />
              <span class="mark"></span>
              5
            </label>
          </div>
        </div>
        <div class="form-field">
          <label>Maximum Skill Level</label>
          <div style="display: flex; gap: 0.5em">
            <label class="radio">
              <input type="radio" name="max-s-l" checked />
              <span class="mark"></span>
              1
            </label>
            <label class="radio">
              <input type="radio" name="max-s-l" />
              <span class="mark"></span>
              2
            </label>
            <label class="radio">
              <input type="radio" name="max-s-l" />
              <span class="mark"></span>
              3
            </label>
            <label class="radio">
              <input type="radio" name="max-s-l" />
              <span class="mark"></span>
              4
            </label>
            <label class="radio">
              <input type="radio" name="max-s-l" />
              <span class="mark"></span>
              5
            </label>
          </div>
        </div>
        <p>Creator: Atikur Rahman</p>
        <div>
          <button type="reset">Reset</button>
          <button type="submit">Submit</button>
        </div>
      </form>
    </main>
  </body>
</html>
